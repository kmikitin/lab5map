
<!DOCTYPE html>
<html>
    <head>
        <title>US Population Age 2020</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>        
        <link href="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.min.css" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.pkgd.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>
        <script type="text/javascript" src="usPopAge.js"></script>

        <style type="text/css">
            html,
            body {
                height: 100%;
                margin: 0;
            }
            .legend {
                padding: 6px 8px;
                line-height: 18px;
                background: rgba(255,255,255,0.9);
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
                border-radius: 5px;
            }
            .legend i {
                width: 18px;
                height: 18px;
                float: left;
                margin-right: 8px;
                opacity: 0.7;
            }
            /* .bb-title {
                font-weight: bold;
            } */
            #map {
                height: 100vh;
                width: 100%;
            }

        </style>

    </head>

    <body>
        <div id="map"></div>
        <div id="chart"></div>
        
        <script type="text/javascript">

            let map = L.map('map', {
              center: [38.20,-98.79],
              zoom: 4
            });

             L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
               attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
               maxZoom: 11,
               minZoom: 5
             }).addTo(map);

            function getColor(value) {
                return value > 996 ? '#034e7b':
                       value > 593 ? '#0570b0':
                       value > 287 ? '#3690c0':
                       value > 187 ? '#74a9cf':
                       value > 114 ? '#a6bddb':
                       value > 44  ? '#d0d1e6':
                                     '#f1eef6';
            }

            function style(feature){
                return {
                    fillColor: getColor(feature.properties.PopDensity),
                    weight: 2,
                    opacity: 1,
                    color: 'gray',
                    fillOpacity: 0.9
                };
            }

            function makeChart(props) {
                bb.generate({
                    bindto: '#chart',
                    size: {
                        height: 250,
                        width: 180        
                    },
                    title:{
                        text: props.NAME + '\n Total Population: ' + props.POP2020,
                        padding: {
                            bottom: 25
                        }
                    },
                    data: {
                        columns: [  
                            ['Under 19', props.PctUnder19],
                            ['20 to 29', props.Pct20to29],
                            ['30 to 39', props.Pct30to39],
                            ['40 to 49', props.Pct40to49],
                            ['50 to 59', props.Pct50to59],
                            ['60 Plus', props.Pct60Plus],
                        ],
                        type: 'pie',
                    },
                    pie:{
                        label: {
                            show: false
                        },
                        width: 30
                    },
                    color:{
                        pattern:["#E69F00", "#56B4E9", "#009E73", "#0072B2", "#CC79A7", "#D55E00"] // a colorblind-safe set (Okabe-Ito)
                    }
                });
            }
            
            function highlightFeature(e) {
                let layer = e.target;
                
                layer.setStyle({
                    weight: 5,
                    color: '#666',
                    fillOpacity: 0.7
                });

                // Fix display layer problems with IE and Opera (no need to change anything)
                if (!L.Browser.ie && !L.Browser.opera) {
                    layer.bringToFront();
                }         
            }

            function resetHighlight(e) {
                geojson.resetStyle(e.target);
            }

            function onEachFeature(feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                });
            }
                    
            let tooltip = document.getElementById("chart");

            geojson = L.geoJson(data, {
                style:style,
                onEachFeature: onEachFeature
            }).bindTooltip(tooltip).addTo(map);

            geojson.on('tooltipopen', function(e) {
                makeChart(e.layer.feature.properties);
            });
            
            let legend = L.control({position: 'topright'}); // Try the other three corners if you like.

            legend.onAdd = function (map) {

                let div = L.DomUtil.create('div', 'legend'),
                    grades = [6, 44, 114, 187, 287, 593, 996];

                div.innerHTML = '<b>Population Density 2020 </b> <br> People Per Square Mile <br>';

                for (let i = 0; i < grades.length; i++) {
                    div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
                }

                return div;
            };

            legend.addTo(map);

        </script>
   </body>
</html>
